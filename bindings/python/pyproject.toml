[project]
name = "zprivacy402"
version = "1.0.0"
description = "Python SDK for ZPrivacy402 Risk Engine with zk-STARK proofs"
authors = [{ name = "ZPrivacy402 Team", email = "dev@zprivacy402.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["zprivacy402", "risk-engine", "zk-stark", "solana", "ai-agent", "blockchain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "solana>=0.30.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.8",
]

[project.urls]
Homepage = "https://zprivacy402.com"
Documentation = "https://docs.zprivacy402.com"
Repository = "https://github.com/zprivacy402/risk-engine-sdk"
Issues = "https://github.com/zprivacy402/risk-engine-sdk/issues"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "zprivacy402._native"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
